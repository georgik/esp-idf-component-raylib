## IDF Component Manager Manifest File
dependencies:
  idf:
    version: ">=5.5.0"
  # Local raylib component - relative path from examples/esp_board_hello/main/
  # Structure: raylib/examples/esp_board_hello/main/ -> raylib/ (up 3 levels)
  georgik/raylib:
    version: "*"
    override_path: "../../../.."
  # AtomS3R display is a GC9107 panel (register-compatible with GC9A01).
  # ESP-IDF ships no dedicated GC9107 driver, so we drive it with gc9a01.
  espressif/esp_lcd_gc9a01: "*"
