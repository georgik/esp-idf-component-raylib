name: Build and Test Raylib Examples

on:
  workflow_dispatch:
    inputs:
      esp_idf_version:
        description: 'ESP-IDF version'
        required: false
        default: 'release-v6.1'
        type: choice
        options:
          - 'release-v6.1'
          - 'latest'

jobs:
  # Build job (GitHub-hosted runner).
  #
  # Builds each example with ESP-IDF and uploads the whole build/ directory as a
  # GitHub artifact. The subsequent "flash" job downloads these artifacts on the
  # local (self-hosted) hardware runner instead of rebuilding, then flashes every
  # board via espbrew. All orchestration — expanding artifacts, flashing and
  # monitoring every board IN PARALLEL (the cluster leader's worker pool handles
  # concurrency, so the phase takes ~the longest board, not the sum), tracking
  # per-board results, and printing a concise GitHub-annotated report — lives
  # inside espbrew, driven by the boards.yaml manifest.
  #
  # To add a new board: add the same entry to BOTH the `device` matrix below AND
  # the matching entry in boards.yaml (generated by the "flash" job; see the
  # companion boards.yaml in this repo). The `alias` must match the alias
  # registered in the espbrew cluster (espbrew.toml).
  build:
    name: Build (${{ matrix.device.alias }})
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not
    # silently migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device:
          - alias: m5stack-atom-s3r
            example: esp32s3/m5stack-atom-s3r_hello
          - alias: m5stack-core2
            example: esp32/m5stack-core2_hello
          - alias: esp32-s3-box-3
            example: esp32s3/espressif-esp32-s3-box-3_hello
          - alias: esp32-s3-lcd-ev-board
            example: esp32s3/espressif-esp32-s3-lcd-ev-board_hello
          # TEMP DISABLED: esp32s3/m5stack-atom-s3_hello build does not work (resolving later).
          # Re-enable when fixed:
          # - alias: m5stack-atom-s3
          #   example: esp32s3/m5stack-atom-s3_hello
          - alias: esp-vocat
            example: esp32s3/espressif-esp-vocat_hello
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set ESP-IDF target
        run: |
          CHIP="${{ matrix.device.example }}"
          if [[ "$CHIP" == esp32s3/* ]]; then
            echo "TARGET=esp32s3" >> $GITHUB_ENV
          elif [[ "$CHIP" == esp32/* ]]; then
            echo "TARGET=esp32" >> $GITHUB_ENV
          else
            echo "Unknown target for: $CHIP"
            exit 1
          fi

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: ${{ inputs.esp_idf_version || 'release-v6.1' }}
          target: ${{ env.TARGET }}
          path: '.'
          command: |
            set -e
            cd raylib/examples/${{ matrix.device.example }}
            idf.py build

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${{ matrix.device.example }}"
          ARTIFACT_NAME="flash-files-${SAFE_NAME//\//-}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: raylib/examples/${{ matrix.device.example }}/build
          retention-days: 7

  # Flash job (local self-hosted hardware runner).
  #
  # Downloads the build artifacts produced by the "build" job and flashes each
  # board via espbrew. The `flash-batch` command (a top-level espbrew command,
  # NOT `flash --manifest`) drives everything from boards.yaml: it expands the
  # artifacts, flashes + monitors every board in parallel, tracks results, and
  # prints a concise GitHub-annotated report.
  #
  # The monitor uses --exit-on-error so a board that prints "abort() was called
  # at PC" (a boot/firmware crash) fails immediately.
  flash:
    name: Flash all boards
    runs-on: [self-hosted]
    needs: build
    # Run even if some builds failed, so a single board's failed build does not
    # block flashing the others. Boards whose artifact is missing are skipped.
    if: always()
    env:
      ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}
      ESPBREW_VERSION: v0.8.0
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download espbrew
        run: |
          set -euo pipefail
          # Download to the repo root ($GITHUB_WORKSPACE); espbrew is invoked by
          # absolute path below so the cwd does not matter.
          curl -fsSL \
            "https://github.com/georgik/espbrew-go/releases/download/${ESPBREW_VERSION}/espbrew-linux-amd64" \
            -o espbrew
          chmod +x ./espbrew
          ./espbrew --version

      - name: Download build artifacts
        uses: actions/download-artifact@7.0.1
        with:
          pattern: flash-files-*
          path: tmp-artifacts
          merge-multiple: false   # keep one subdir per artifact

      # Single source of truth for flash-batch. Each alias MUST match the alias
      # registered in the espbrew cluster (espbrew.toml). Each build_dir points
      # at the downloaded artifact subdir (artifact name is
      # "flash-files-<example>" with "/" replaced by "-"). See the companion
      # boards.yaml in this repo.
      - name: Write boards.yaml
        run: |
          set -euo pipefail
          cat > boards.yaml <<'EOF'
          boards:
            - alias: m5stack-atom-s3r
              build_dir: tmp-artifacts/flash-files-esp32s3-m5stack-atom-s3r_hello
            - alias: m5stack-core2
              build_dir: tmp-artifacts/flash-files-esp32-m5stack-core2_hello
            - alias: esp32-s3-box-3
              build_dir: tmp-artifacts/flash-files-esp32s3-espressif-esp32-s3-box-3_hello
            - alias: esp32-s3-lcd-ev-board
              build_dir: tmp-artifacts/flash-files-esp32s3-espressif-esp32-s3-lcd-ev-board_hello
            - alias: esp-vocat
              build_dir: tmp-artifacts/flash-files-esp32s3-espressif-esp-vocat_hello
          EOF
          cat boards.yaml

      - name: Flash + monitor all boards
        run: |
          set -euo pipefail
          # espbrew auto-detects the CI environment (GITHUB_ACTIONS=1) and prints a
          # concise, annotation-rich report instead of the interactive progress bar.
          # flash-batch reads boards.yaml, expands each artifact, flashes + monitors
          # every board in parallel, and exits non-zero if any non-optional board
          # fails — failing this step (and the run).
          #
          # Overrides, if ever needed: --ci (force CI output), --interactive
          # (keep the progress bar even in CI), --quiet (reduced output),
          # --verbose (more logs).
          ./espbrew flash-batch \
            --manifest boards.yaml \
            --monitor-duration 15 \
            --exit-on-error "abort() was called"
