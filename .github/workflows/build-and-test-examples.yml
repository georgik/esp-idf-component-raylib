name: Build and Test Raylib Examples

on:
  workflow_dispatch:
    inputs:
      esp_idf_version:
        description: 'ESP-IDF version'
        required: false
        default: 'release-v6.1'
        type: choice
        options:
          - 'release-v6.1'
          - 'latest'

jobs:
  # Build job (GitHub-hosted runner).
  #
  # Builds each example with ESP-IDF and uploads the whole build/ directory as a
  # GitHub artifact. The subsequent "flash" job downloads these artifacts on the
  # local (self-hosted) hardware runner instead of rebuilding, then flashes every
  # board via espbrew using --filter-alias so each board resolves to the right
  # device.
  #
  # To add a new board: add the same entry to BOTH the `device` matrix below AND
  # the `BOARDS` array in the "flash" job (alias|example). The `alias` must match
  # the alias registered in the espbrew cluster (espbrew.toml).
  build:
    name: Build (${{ matrix.device.alias }})
    # Pinned to ubuntu-24.04 (was ubuntu-latest) so the run does not
    # silently migrate to Ubuntu 26 on 2026-10-19 (see GH runner-images#14748).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device:
          - alias: m5stack-atom-s3r
            example: esp32s3/m5stack-atom-s3r_hello
          - alias: m5stack-core2
            example: esp32/m5stack-core2_hello
          - alias: esp32-s3-box-3
            example: esp32s3/espressif-esp32-s3-box-3_hello
          - alias: esp32-s3-lcd-ev-board
            example: esp32s3/espressif-esp32-s3-lcd-ev-board_hello
          # TEMP DISABLED: esp32s3/m5stack-atom-s3_hello build does not work (resolving later).
          # Re-enable when fixed:
          # - alias: m5stack-atom-s3
          #   example: esp32s3/m5stack-atom-s3_hello
          - alias: esp-vocat
            example: esp32s3/espressif-esp-vocat_hello
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set ESP-IDF target
        run: |
          CHIP="${{ matrix.device.example }}"
          if [[ "$CHIP" == esp32s3/* ]]; then
            echo "TARGET=esp32s3" >> $GITHUB_ENV
          elif [[ "$CHIP" == esp32/* ]]; then
            echo "TARGET=esp32" >> $GITHUB_ENV
          else
            echo "Unknown target for: $CHIP"
            exit 1
          fi

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: ${{ inputs.esp_idf_version || 'release-v6.1' }}
          target: ${{ env.TARGET }}
          path: '.'
          command: |
            set -e
            cd raylib/examples/${{ matrix.device.example }}
            idf.py build

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${{ matrix.device.example }}"
          ARTIFACT_NAME="flash-files-${SAFE_NAME//\//-}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: raylib/examples/${{ matrix.device.example }}/build
          retention-days: 7

  # Flash job (local self-hosted hardware runner).
  #
  # Downloads the build artifacts produced by the "build" job and flashes each
  # board via espbrew (--filter-alias). All boards flash CONCURRENTLY inside this
  # single job (each board's flash+monitor is a backgrounded espbrew invocation),
  # because there is only ONE self-hosted runner, which would otherwise serialize
  # matrix jobs one-at-a-time. espbrew flashes multiple devices in parallel, so
  # the whole phase takes ~the longest single board (the monitor duration), not
  # the sum of all boards.
  #
  # The monitor uses --exit-on-error so the job fails immediately if a board
  # prints "abort() was called at PC" (a boot/firmware crash).
  flash:
    name: Flash all boards
    runs-on: [self-hosted]
    needs: build
    # Run even if some builds failed, so a single board's failed build does not
    # block flashing the others. Boards whose artifact is missing are skipped.
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Download espbrew
        env:
          ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}
        run: |
          set -e
          # Download to the repo root ($GITHUB_WORKSPACE). We cd into each example
          # below, so reference espbrew by its absolute path after the cd.
          curl -fsSL https://github.com/georgik/espbrew-go/releases/download/v0.7.0/espbrew-linux-amd64 -o espbrew
          chmod +x ./espbrew
          ./espbrew --help >/dev/null 2>&1

      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: flash-files-*
          path: tmp-artifacts
          merge-multiple: false

      - name: Flash and monitor all boards (concurrent)
        env:
          ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}
          ERROR_STRING: "abort() was called at PC"
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ESPBEW="$ROOT/espbrew"
          # Use a unique dir per run ($GITHUB_RUN_ID) so a persistent
          # self-hosted runner never prints stale logs from an earlier run —
          # no deletion is needed, which avoids any risk of removing the wrong path.
          LOGDIR="$ROOT/flash-logs/$GITHUB_RUN_ID"
          mkdir -p "$LOGDIR"

          # Each entry: "alias|example". Kept in sync with the build matrix.
          BOARDS=(
            "m5stack-atom-s3r|esp32s3/m5stack-atom-s3r_hello"
            "m5stack-core2|esp32/m5stack-core2_hello"
            "esp32-s3-box-3|esp32s3/espressif-esp32-s3-box-3_hello"
            "esp32-s3-lcd-ev-board|esp32s3/espressif-esp32-s3-lcd-ev-board_hello"
            # TEMP DISABLED: build does not work (resolving later).
            # "m5stack-atom-s3|esp32s3/m5stack-atom-s3_hello"
            "esp-vocat|esp32s3/espressif-esp-vocat_hello"
          )

          # Launch every board's flash+monitor concurrently. Each board writes to
          # its OWN file so the parallel writes never interleave on the console.
          pids=()
          pid_aliases=()
          launched=0
          skipped=()
          for entry in "${BOARDS[@]}"; do
            alias="${entry%%|*}"
            example="${entry##*|}"
            safe="${example//\//-}"
            src="$ROOT/tmp-artifacts/flash-files-$safe"

            if [ ! -d "$src" ]; then
              echo "::error::Build artifacts missing for $example (did its build succeed? Skipping)."
              skipped+=("$alias")
              continue
            fi

            # Place the downloaded build/ contents where espbrew expects them.
            mkdir -p "$ROOT/raylib/examples/$example/build"
            cp -a "$src/." "$ROOT/raylib/examples/$example/build/"

            (
              set -e
              cd "$ROOT/raylib/examples/$example"
              # Flash first; espbrew reads offsets from build/flash_args.
              "$ESPBEW" flash --cluster "$ESPBREW_CLUSTER" --filter-alias "$alias" > "$LOGDIR/$alias.flash.log" 2>&1
              # Monitor serial output; fail fast if the board aborts.
              "$ESPBEW" monitor --cluster "$ESPBREW_CLUSTER" --filter-alias "$alias" --duration 5 --exit-on-error "$ERROR_STRING" > "$LOGDIR/$alias.monitor.log" 2>&1
            ) &
            pids+=("$!")
            launched=$((launched + 1))
          done

          if [ "$launched" -eq 0 ]; then
            echo "::error::No build artifacts found to flash. Aborting."
            exit 1
          fi

          failed=()
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              failed+=("${pid_aliases[$i]}")
            fi
          done

          # Helper: print one board's logs under an explicit banner.
          print_board() {
            local alias="$1"
            if [ -f "$LOGDIR/$alias.flash.log" ]; then
              echo "##################################################################"
              echo "# $alias — flash"
              echo "##################################################################"
              cat "$LOGDIR/$alias.flash.log"
            fi
            if [ -f "$LOGDIR/$alias.monitor.log" ]; then
              echo "##################################################################"
              echo "# $alias — monitor"
              echo "##################################################################"
              cat "$LOGDIR/$alias.monitor.log"
            fi
          }

          # Helper: is this alias in the failed list?
          is_failed() {
            local needle="$1"; shift
            for item in "$@"; do [ "$item" = "$needle" ] && return 0; done
            return 1
          }

          # Print logs: SUCCESSFUL boards first, then any FAILED boards last, so the
          # problem sits right above the summary. Each `cat` is atomic (all
          # background jobs have exited) so the output stays clean and ordered.
          for entry in "${BOARDS[@]}"; do
            alias="${entry%%|*}"
            is_failed "$alias" "${failed[@]}" || print_board "$alias"
          done
          for entry in "${BOARDS[@]}"; do
            alias="${entry%%|*}"
            is_failed "$alias" "${failed[@]}" && print_board "$alias"
          done

          # Per-board summary for quick identification of failures.
          success=()
          for alias in "${pid_aliases[@]}"; do
            is_failed "$alias" "${failed[@]}" || success+=("$alias")
          done

          echo ""
          echo "===================== FLASH SUMMARY ====================="
          echo "SUCCESS (${#success[@]}): ${success[*]:-none}"
          echo "FAILED   (${#failed[@]}): ${failed[*]:-none}"
          echo "SKIPPED  (${#skipped[@]}): ${skipped[*]:-none}"
          echo "========================================================="

          if [ "${#failed[@]}" -ne 0 ] || [ "${#skipped[@]}" -ne 0 ]; then
            echo "::error::One or more boards failed to flash/monitor or were skipped (missing build artifact). See the FLASH SUMMARY and logs above."
            exit 1
          fi
          echo "All $launched boards flashed and monitored successfully."
