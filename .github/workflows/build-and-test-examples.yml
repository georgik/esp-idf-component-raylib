name: Build and Test Raylib Examples

on:
  workflow_dispatch:
    inputs:
      esp_idf_version:
        description: 'ESP-IDF version'
        required: false
        default: 'release-v6.1'
        type: choice
        options:
          - 'release-v6.1'
          - 'latest'

jobs:
  # Build job (GitHub-hosted runner).
  #
  # Builds each example with ESP-IDF and uploads the whole build/ directory as a
  # GitHub artifact. The subsequent "flash" job downloads this artifact on the
  # local (self-hosted) hardware runner instead of rebuilding, then flashes it
  # via espbrew using --filter-alias so each board resolves to the right device.
  #
  # To add a new board: add an entry to the `device` matrix below (both the
  # "build" and "flash" jobs share the same matrix). The `alias` must match the
  # alias registered in the espbrew cluster (espbrew.toml).
  build:
    name: Build (${{ matrix.device.alias }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - alias: m5stack-atom-s3
            example: esp32s3/m5stack-atom-s3_hello
          - alias: esp32-s3-box-3
            example: esp32s3/espressif-esp32-s3-box-3_hello
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set ESP-IDF target
        run: |
          CHIP="${{ matrix.device.example }}"
          if [[ "$CHIP" == esp32s3/* ]]; then
            echo "TARGET=esp32s3" >> $GITHUB_ENV
          elif [[ "$CHIP" == esp32/* ]]; then
            echo "TARGET=esp32" >> $GITHUB_ENV
          else
            echo "Unknown target for: $CHIP"
            exit 1
          fi

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: ${{ inputs.esp_idf_version || 'release-v6.1' }}
          target: ${{ env.TARGET }}
          path: '.'
          command: |
            set -e
            cd raylib/examples/${{ matrix.device.example }}
            idf.py build

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${{ matrix.device.example }}"
          ARTIFACT_NAME="flash-files-${SAFE_NAME//\//-}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: raylib/examples/${{ matrix.device.example }}/build
          retention-days: 7

  # Flash job (local self-hosted hardware runner).
  #
  # Downloads the build artifact produced by the "build" job and flashes it to
  # the device selected by --filter-alias. No build happens on this runner.
  flash:
    name: Flash (${{ matrix.device.alias }})
    runs-on: [self-hosted]
    needs: build
    strategy:
      matrix:
        device:
          - alias: m5stack-atom-s3
            example: esp32s3/m5stack-atom-s3_hello
          - alias: esp32-s3-box-3
            example: esp32s3/espressif-esp32-s3-box-3_hello
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${{ matrix.device.example }}"
          ARTIFACT_NAME="flash-files-${SAFE_NAME//\//-}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ env.artifact_name }}
          path: raylib/examples/${{ matrix.device.example }}/build

      - name: Download espbrew
        env:
          ESPBREW_CLUSTER: ${{ secrets.ESPBREW_CLUSTER }}
        run: |
          set -e
          # Download to the repo root ($GITHUB_WORKSPACE). We cd into the example
          # below, so reference espbrew by its absolute path after the cd.
          curl -fsSL https://github.com/georgik/espbrew-go/releases/download/v0.6.0/espbrew-linux-amd64 -o espbrew
          chmod +x ./espbrew
          ./espbrew --help >/dev/null 2>&1

          # espbrew auto-detects the ESP-IDF project from the current directory
          # (this example dir) and reads flash offsets from its build/flash_args.
          cd raylib/examples/${{ matrix.device.example }}
          "$GITHUB_WORKSPACE/espbrew" flash --cluster "${{ secrets.ESPBREW_CLUSTER }}" --filter-alias "${{ matrix.device.alias }}"
